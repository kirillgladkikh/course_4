{% extends "base.html" %}

{% block content %}
<h1>Список пользователей</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Email</th>
            <th>Активен</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.email }}</td>
            <td>
                {% if user.is_active %}
                    <span class="text-success">Активен</span>
                {% else %}
            <span class="text-danger">Заблокирован</span>
                {% endif %}
            </td>
            <td>
                <a href="{% url 'users:user_update' user.pk %}" class="btn btn-sm btn-outline-primary">Редактировать</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
