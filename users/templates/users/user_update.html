{% extends "base.html" %}

{% block content %}
<h1>Редактирование пользователя: {{ object.email }}</h1>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-check-label">
            <input type="checkbox" name="is_active" class="form-check-input" {% if object.is_active %}checked{% endif %}>
            Активен (разблокировать)
        </label>
    </div>
    <div class="mb-3">
        <label class="form-check-label">
            <input type="checkbox" name="is_staff" class="form-check-input" {% if object.is_staff %}checked{% endif %}>
            Менеджер (доступ к админке)
        </label>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'users:users_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
