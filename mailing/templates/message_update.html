{% extends "base.html" %}
{% load static %}

{% block content %}

    <h2>Редактировать Сообщение (Письмо)</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.errors }}  <!-- Вывод всех ошибок формы -->
        {{ form.non_field_errors }}  <!-- Ошибки, не привязанные к полям -->

        <div class="mb-3">
            <label for="id_subject" class="form-label">Тема письма</label>
            {{ form.email }}
        </div>

        <div class="mb-3">
            <label for="id_body" class="form-label">Тело письма</label>
            {{ form.full_name }}
        </div>

        <div class="mb-3">
            <label for="id_owner" class="form-label">Владелец (User)</label>
            {{ form.owner }}
        </div>

        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a href="{% url 'mailing:messages_list.html' %}" class="btn btn-secondary">Отмена</a>
    </form>

{% endblock %}
